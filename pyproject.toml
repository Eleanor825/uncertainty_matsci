[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matdiscovery-whitebox"
version = "0.1.0"
description = "Reproducible white-box uncertainty and Agentic ESOpt for MADE and CrystalGym"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "networkx>=3.3",
]

[project.optional-dependencies]
policy = [
  "torch==2.9.1",
  "transformers==5.17.0",
  "accelerate>=1.1",
  "safetensors>=0.8",
  "sentencepiece>=0.2",
]
dev = ["pytest>=8.0", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
